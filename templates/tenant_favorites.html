{% extends "base_tenant.html" %}

{% block content %}
<div class="mb-10">
    <h1 class="text-4xl font-black text-black tracking-tighter uppercase italic">Saved Tours</h1>
    <p class="text-gray-500 font-medium tracking-tight">Your curated list of potential homes.</p>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
    {% for fav in favorites %}
    <div class="group bg-white rounded-[2.5rem] overflow-hidden border border-gray-100 shadow-sm hover:shadow-2xl transition-all duration-500">
        <div class="relative h-48 bg-gray-900 flex items-center justify-center">
             <i class="fas fa-home text-3xl text-gray-800"></i>
             <a href="{% url 'toggle-favorite' fav.property.id %}" class="absolute top-4 right-4 text-red-500 bg-white w-8 h-8 rounded-full flex items-center justify-center shadow-md transition hover:scale-110">
                 <i class="fas fa-heart"></i>
             </a>
        </div>
        <div class="p-6">
            <h3 class="text-xl font-black text-black">{{ fav.property.title }}</h3>
            <p class="text-gray-400 text-xs mb-4">
                <i class="fas fa-map-marker-alt mr-2 text-blue-600"></i> {{ fav.property.location }}
            </p>
            <a href="{% url 'property-detail' fav.property.id %}" class="block w-full text-center bg-blue-600 text-white py-3 rounded-xl font-black hover:bg-black transition shadow-lg">
                Enter 3D Tour
            </a>
        </div>
    </div>
    {% empty %}
    <div class="col-span-full py-20 text-center bg-white rounded-[3rem] border-2 border-dashed border-gray-100">
        <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-4">
            <i class="far fa-heart text-gray-300 text-2xl"></i>
        </div>
        <p class="text-gray-400 font-bold italic mb-6">You haven't saved any tours yet.</p>
        <a href="{% url 'tenant-explore' %}" class="bg-black text-white px-8 py-3 rounded-xl font-black transition hover:bg-blue-600">
            Start browsing
        </a>
    </div>
    {% endfor %}
</div>
{% endblock %}
