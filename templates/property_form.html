{% extends "base_landlord.html" %}

{% block content %}
<div class="max-w-2xl mx-auto py-8">
    <div class="bg-white rounded-[2.5rem] shadow-2xl border border-gray-100 overflow-hidden">
        <div class="bg-blue-600 p-8 text-white">
            <h1 class="text-3xl font-black italic tracking-tighter uppercase">List Property</h1>
            <p class="text-blue-100 font-medium">Create a high-immersion 3D virtual listing.</p>
        </div>

        <form method="post" class="p-8 space-y-6">
            {% csrf_token %}
            
            <div id="form-container" class="space-y-5">
                {% for field in form %}
                <div class="field-wrapper">
                    <label class="block text-[10px] font-black uppercase tracking-widest text-gray-400 mb-2 ml-1">
                        {{ field.label }}
                    </label>
                    {{ field }}
                    {% if field.errors %}
                        <p class="text-red-500 text-xs mt-1 font-bold">{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
                {% endfor %}
            </div>

            <div class="pt-6 border-t border-gray-100 flex items-center justify-between">
                <a href="{% url 'landlord-dashboard' %}" class="text-gray-400 font-black uppercase text-xs tracking-widest hover:text-black transition">
                    <i class="fas fa-arrow-left mr-2"></i> Back
                </a>
                <button type="submit" class="bg-blue-600 hover:bg-black text-white px-12 py-4 rounded-2xl font-black transition shadow-xl transform hover:-translate-y-1 active:scale-95">
                    PUBLISH LISTING
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const inputs = document.querySelectorAll('#form-container input, #form-container textarea, #form-container select');
        
        inputs.forEach(el => {
            el.classList.add(
                'w-full', 'px-4', 'py-3', 'rounded-xl', 'border', 'border-gray-200', 'bg-gray-50',
                'focus:border-blue-600', 'focus:bg-white', 'focus:ring-4', 'focus:ring-blue-50', 
                'outline-none', 'transition', 'font-bold', 'text-gray-700'
            );
            
            if (el.name === 'virtual_tour_url') {
                el.placeholder = "Paste Matterport URL here...";
                el.classList.add('font-mono', 'text-sm');
            }
        });
    });
</script>
{% endblock %}
