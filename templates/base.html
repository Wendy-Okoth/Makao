<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makao | Virtual Real Estate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-900 flex flex-col min-h-screen">

    <nav class="bg-blue-600 p-4 text-white shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-8">
                <a href="/" class="text-2xl font-bold tracking-tight">MAKAO</a>
                <div class="hidden md:flex space-x-6 font-medium">
                    <a href="/" class="hover:text-blue-200 transition">Home</a>
                    <a href="/about" class="hover:text-blue-200 transition">About</a>
                </div>
            </div>
            <div class="space-x-4">
                <a href="/login" class="hover:underline">Login</a>
                <a href="/signup" class="bg-white text-blue-600 px-4 py-2 rounded-lg text-sm font-bold hover:bg-gray-100 transition">Get Started</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto mt-10 p-4 flex-grow">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-blue-600 text-white py-10 mt-20">
        <div class="container mx-auto px-4">
            <div class="flex flex-col md:flex-row justify-between items-center border-b border-blue-500 pb-8 mb-8">
                <div class="mb-4 md:mb-0 text-center md:text-left">
                    <h2 class="text-2xl font-bold">MAKAO</h2>
                    <p class="text-blue-100 mt-2">The future of real estate in Kenya.</p>
                </div>
                
                <div class="flex space-x-6 text-2xl">
                    <a href="#" class="hover:text-blue-200 transition"><i class="fab fa-facebook"></i></a>
                    <a href="#" class="hover:text-blue-200 transition"><i class="fab fa-instagram"></i></a>
                    <a href="#" class="hover:text-blue-200 transition"><i class="fab fa-tiktok"></i></a>
                </div>
            </div>
            <div class="text-center text-blue-100 text-sm">
                &copy; 2026 Makao Virtual Real Estate. All rights reserved.
            </div>
        </div>
    </footer>

</body>
</html>
