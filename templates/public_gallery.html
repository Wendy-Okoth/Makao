{% extends "base.html" %}

{% block content %}
<div class="max-w-7xl mx-auto px-6 py-12">
    <div class="mb-12 text-center">
        <h1 class="text-5xl font-black text-gray-900 tracking-tighter uppercase italic mb-4">Marketplace</h1>
        <p class="text-xl text-gray-500 font-medium">Browse our exclusive 3D virtual tours without leaving your seat.</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
        {% for property in properties %}
        <div class="bg-white rounded-[2.5rem] overflow-hidden shadow-sm border border-gray-100 hover:shadow-2xl transition-all duration-500">
            <div class="h-64 bg-gray-200 relative">
                <div class="w-full h-full flex items-center justify-center text-gray-400">
                    <i class="fas fa-camera text-4xl"></i>
                </div>
                <div class="absolute bottom-4 left-4 bg-white/90 backdrop-blur px-4 py-2 rounded-xl font-black text-blue-600">
                    KES {{ property.price }}
                </div>
            </div>
            <div class="p-8">
                <h3 class="text-2xl font-black text-gray-900 mb-2">{{ property.title }}</h3>
                <p class="text-gray-500 mb-6 flex items-center">
                    <i class="fas fa-map-marker-alt mr-2 text-blue-600"></i> {{ property.location }}
                </p>
                <a href="{% url 'login' %}" class="block w-full text-center bg-gray-900 text-white py-4 rounded-2xl font-black hover:bg-blue-600 transition">
                    Login to View 3D Tour
                </a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
