{% extends "base_landlord.html" %}

{% block content %}
<div class="max-w-4xl mx-auto py-10">
    <div class="flex items-center justify-between mb-10">
        <a href="{% url 'landlord-dashboard' %}" class="text-gray-400 hover:text-black font-black flex items-center transition">
            <i class="fas fa-chevron-left mr-2"></i> BACK
        </a>
        <div class="text-right">
            <h1 class="text-3xl font-black text-black italic tracking-tighter uppercase">List Property</h1>
            <p class="text-blue-600 font-bold text-xs uppercase tracking-[0.2em]">Create a high-immersion 3D virtual listing</p>
        </div>
    </div>

    <div class="bg-white rounded-[3rem] shadow-2xl border border-gray-100 overflow-hidden">
        <form method="POST" class="p-10 md:p-16 space-y-8">
            {% csrf_token %}
            
            <div class="space-y-2">
                <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Property Title</label>
                <input type="text" name="title" placeholder="e.g. Modern 3-Bedroom Penthouse" 
                    class="w-full bg-gray-50 border-2 border-gray-50 focus:border-blue-600 focus:bg-white p-5 rounded-2xl outline-none transition font-bold text-lg" required>
            </div>

            <div class="space-y-2">
                <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Property Category</label>
                <div class="relative">
                    <select name="category" required
                        class="w-full bg-gray-50 border-2 border-gray-50 focus:border-blue-600 focus:bg-white p-5 rounded-2xl outline-none transition font-bold appearance-none cursor-pointer">
                        <option value="bedsitter">Bedsitter</option>
                        <option value="single_room">Single Room</option>
                        <option value="one_bedroom">1 Bedroom</option>
                        <option value="two_bedroom">2 Bedroom</option>
                        <option value="three_bedroom">3 Bedroom</option>
                        <option value="studio">Studio</option>
                        <option value="mansionette">Mansionette</option>
                    </select>
                    <i class="fas fa-chevron-down absolute right-6 top-1/2 -translate-y-1/2 text-gray-300 pointer-events-none"></i>
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Description</label>
                <textarea name="description" rows="4" placeholder="Tell tenants what makes this space unique..." 
                    class="w-full bg-gray-50 border-2 border-gray-50 focus:border-blue-600 focus:bg-white p-5 rounded-2xl outline-none transition font-medium" required></textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Location</label>
                    <input type="text" name="location" placeholder="e.g. Riverside Drive, Nairobi" 
                        class="w-full bg-gray-50 border-2 border-gray-50 focus:border-blue-600 focus:bg-white p-5 rounded-2xl outline-none transition font-bold" required>
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Price (KES / Month)</label>
                    <input type="number" name="price" placeholder="50000" 
                        class="w-full bg-gray-50 border-2 border-gray-50 focus:border-blue-600 focus:bg-white p-5 rounded-2xl outline-none transition font-bold" required>
                </div>
            </div>

            <div class="space-y-2">
                <div class="flex items-center justify-between mb-1">
                    <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Virtual Tour URL (Matterport)</label>
                    <span class="text-[10px] font-black text-blue-600 bg-blue-50 px-2 py-1 rounded">3D ENABLED</span>
                </div>
                <div class="relative">
                    <input type="url" name="virtual_tour_url" placeholder="Paste your Matterport link here..." 
                        class="w-full bg-gray-50 border-2 border-gray-50 focus:border-blue-600 focus:bg-white p-5 pr-14 rounded-2xl outline-none transition font-mono text-sm">
                    <i class="fas fa-vr-cardboard absolute right-6 top-1/2 -translate-y-1/2 text-gray-300"></i>
                </div>
            </div>

            <div class="pt-6">
                <button type="submit" class="w-full bg-black hover:bg-blue-600 text-white py-6 rounded-2xl font-black text-xl transition-all shadow-xl transform hover:-translate-y-1">
                    PUBLISH 3D LISTING
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
